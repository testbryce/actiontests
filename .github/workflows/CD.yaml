name: Deploy
run-name: Deploy ${{ github.ref_name }}

on:
  push:
    branches: main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Write GitHub context to log
        env:
          GITHUB_CONTEXT: ${{ toJSON(github) }}
        run: echo "$GITHUB_CONTEXT"
      - uses: actions/checkout@v3

      - run: printenv
      - run: echo ${{ github.job.environment }}

  deploy-prd:
    environment: prd
    runs-on: ubuntu-latest
    steps:
      - name: Write GitHub context to log
        env:
          GITHUB_CONTEXT: ${{ toJSON(github) }}
        run: echo "$GITHUB_CONTEXT"

      - run: printenv

      - run: echo ${{ github.job.environment }}
